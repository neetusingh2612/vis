[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vis"
version = "0.1.0"
description = "Vehicular Immune System (VIS): a bio-inspired, multi-layered, self-evolving defense for connected and autonomous vehicles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
authors = [{ name = "Anurag" }]
keywords = ["automotive", "intrusion-detection", "federated-learning", "security", "CAN", "V2X"]

# Core stays dependency-light so the skeleton installs and tests run with no
# heavy downloads. Real components pull from the optional extras below.
dependencies = []

[project.optional-dependencies]
ml   = ["numpy>=1.24", "scikit-learn>=1.3"]      # anomaly detection (Phase 2)
fl   = ["flwr>=1.7", "numpy>=1.24"]              # federated learning (Phase 3)
v2x  = ["numpy>=1.24"]                            # kinematic plausibility (Phase 2)
dev  = ["pytest>=7.4", "ruff>=0.4"]
all  = ["vis[ml,fl,v2x,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "eval"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
